- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.
- insert:
    - id: dsh-king
      name: 'dsh-king'
      config:
        enabled: true
        autoApplyOnStart: true
        autoUpdateOnStart: true
        autoRevertOnMissing: false
        injectOnce: false
        stripMnemon: true
        verbose: false
        postPrompt: ""
        postPromptOrder: 5100
        autoRetry: true
        retryMax: 3
        autoContinue: true
        continueMax: 3
        continueText: "继续"
        # dsh-king 增强：默认档案、分组应用、接管旧 dsh-purge 补丁
        profile: "king-standard"
        patchGroups:
          prompt: true
          code: true
          engine: true
          compat: true
          tools: true
        inheritPurgeState: true
        healthCheck: true
